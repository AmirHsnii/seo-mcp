name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/

      # Only unit tests (app/domain/) run in CI: they need no network and no
      # Google credentials. tests/integration/ is intentionally excluded — it
      # requires real GSC credentials that shouldn't live in a public repo's
      # CI secrets for a personal-use project.
      - name: Run unit tests
        run: pytest tests/unit/ -v
